name: habit_app
description: Приложение для избавления от вредных привычек с ИИ-помощником.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.8.0
  flutter_bloc: ^9.1.0
  go_router: ^15.0.0
  flutter_secure_storage: ^9.2.2
  equatable: ^2.0.7
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

# Иконка лаунчера (dart run flutter_launcher_icons)
flutter_launcher_icons:
  android: true
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#0D1512"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png

# Нативный сплэш (dart run flutter_native_splash:create)
flutter_native_splash:
  color: "#0D1512"
  image: assets/icon/splash_icon.png
  android_12:
    color: "#0D1512"
    image: assets/icon/splash_icon.png

flutter:
  uses-material-design: true
